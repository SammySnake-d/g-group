# PR 自己的门禁代码自证:类型检查、lint、门禁自检、变异校验、测试。
# 不是合并的裁判(裁判在 main 上那份可信门禁 workflow 里),但改门禁的 PR 要靠它证明新门禁自己是可信的。
name: self-check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: self-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  self-check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GATE_SANDBOX_IMAGE: node:22.22.0-slim
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: "22.22.0" }
      - run: npm ci
      - name: 拉沙箱镜像(门禁执行 PR 测试只走沙箱,没有就停)
        run: docker pull "$GATE_SANDBOX_IMAGE"
      - name: 类型检查
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: 测试
        run: npm test
      # 门禁自检与变异校验只证明"门禁代码本身可信";本 PR 没改门禁代码或 workflow 时重跑证明不了新东西。
      # 判断范围:相对 PR 基线(push 到 main 时相对上一提交)改了 scripts/gates/** 或 .github/workflows/**。
      - name: 判断是否改了门禁代码
        id: gates
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; else base="${{ github.event.before }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; echo "找不到基线,按改了处理"; exit 0; fi
          if git diff --name-only "$(git merge-base "$base" HEAD)" HEAD | grep -qE '^(scripts/gates/|\.github/workflows/)'; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - name: 门禁自检(真实命令行入口,合规必放行、违规必拦下)
        if: steps.gates.outputs.changed == 'true'
        run: npm run gates:selftest
      - name: 门禁变异校验(把门禁改坏,自检必须发现)
        if: steps.gates.outputs.changed == 'true'
        timeout-minutes: 120
        run: GATE_MUTATION_JOBS=4 npm run gates:mutation
