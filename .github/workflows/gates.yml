name: gates
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22.22" }
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 门禁自检(每个门禁合规必放行、违规必拦下)
        run: npm run gates:selftest
      - name: 测试
        run: npm test
      - name: 机械门禁
        if: github.event_name == 'pull_request'
        run: node scripts/gates/run-all.ts --base origin/${{ github.base_ref }} --branch ${{ github.head_ref }}
